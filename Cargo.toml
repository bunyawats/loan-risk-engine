[package]
name = "loan-risk-engine"
version = "0.1.0"
edition = "2024"
description = "Loan risk-tier microservice (Axum + ZEN decision tables + Jev signals) for loan-onboarding-poc"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bunyawats/loan-risk-engine"
readme = "README.md"
keywords = ["loan", "risk", "decision-table", "axum", "microservice"]
categories = ["finance", "web-programming::http-server"]
include = ["/src", "/tests", "/rules", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
axum = "0.8"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rust_decimal = "1.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
zen-engine = "2"

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
